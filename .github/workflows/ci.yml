name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.9.3, not 6.8.x: Apple removed the AGL framework from the
          # macOS 26 SDK, and Qt's macOS CMake config referenced it
          # until the fix shipped in 6.5.10 / 6.8.4 / 6.9.2
          # (QTBUG-137687). On 6.8.0 every macOS job fails at link with
          # "ld: framework 'AGL' not found".
          #
          # The 6.8 series can't be patched into: it's LTS, so 6.8.4 is
          # commercial-only and open-source mirrors stop at 6.8.3.
          # 6.9.2 is therefore the earliest public build with the fix;
          # 6.9.3 is that series' latest patch.
          version: '6.9.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install libssh (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libssh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libssh)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> $GITHUB_ENV

      # Fetch the prebuilt openssl + libssh tarball published by
      # `.github/workflows/build-windeps.yml` to a `windeps-vN`
      # release. This replaces a ~10 min `vcpkg install` per run with
      # a ~5 s `curl + tar`. Bump WINDEPS_TAG + WINDEPS_SHA256 in
      # lockstep with a re-run of build-windeps.yml when the bundled
      # openssl / libssh need a refresh. See #196.
      - name: Fetch prebuilt openssl + libssh (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDEPS_TAG: windeps-v1
          WINDEPS_SHA256: 187cf10bc46c282ae231c772f559587e92c18c4a2e8db6ff08462e7bc315c4c4
        run: |
          set -euo pipefail
          # $RUNNER_TEMP on windows-latest comes in as a native Windows
          # path (`D:\a\_temp`). Git-bash's tar interprets the `D:` as
          # a `host:path` remote spec and the backslashes as escapes,
          # so it can never find a `-C` target. Forward-slash the path
          # and pair with `--force-local` to neutralise both halves.
          RT="${RUNNER_TEMP//\\//}"
          VERSION=${WINDEPS_TAG#windeps-}
          URL="https://github.com/${{ github.repository }}/releases/download/${WINDEPS_TAG}/qumesh-windeps-x64-windows-${VERSION}.tar.gz"
          curl -sSL "$URL" -o "$RT/windeps.tar.gz"
          echo "$WINDEPS_SHA256  $RT/windeps.tar.gz" | sha256sum -c -
          mkdir -p "$RT/windeps"
          tar --force-local -xzf "$RT/windeps.tar.gz" -C "$RT/windeps"
          # build-windeps.yml drops the debug build tree to halve the
          # tarball, but libssh's exported CMake config still imports
          # the debug-variant config file alongside the release one,
          # and that debug config references `debug/lib/ssh.lib` —
          # which no longer exists, so `find_package(libssh CONFIG …)`
          # bails. Remove the debug-config stub so only release loads.
          rm -f "$RT/windeps/x64-windows/share/libssh/libssh-config-debug.cmake"
          # The tarball opens to a single top-level x64-windows/ tree
          # in the same layout as vcpkg's install prefix, so CMake's
          # `find_package(OpenSSL …)` and `find_package(libssh CONFIG
          # REQUIRED)` resolve once CMAKE_PREFIX_PATH points there.
          # No vcpkg toolchain file needed.
          echo "CMAKE_PREFIX_PATH=$RT/windeps/x64-windows" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: build
        run: ctest --output-on-failure --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build
        run: |
          rem Windows test exes import ssh.dll / libcrypto-3-x64.dll
          rem dynamically and the dynamic loader needs them on PATH.
          rem The bash-shell trick from earlier never propagated cleanly
          rem through git-bash's POSIX→Win32 PATH translation, so do
          rem the prepend in native cmd where %PATH% already uses ;
          rem and Windows-form drive letters.
          set "PATH=%RUNNER_TEMP%\windeps\x64-windows\bin;%PATH%"
          ctest --output-on-failure --parallel

      # Every Windows release through v1.4.1 installed the Qt DLLs into
      # `QuMesh\bin\` while QuMesh.exe sat one level up, so the app
      # never started on a user's machine (#445). Nothing on a PR ran
      # the install rules + windeployqt, and the release smoke launch
      # had Qt's own bin\ on PATH. Install the same tree CPack packs
      # and run it with PATH and the Qt env vars scrubbed.
      - name: Install and verify (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(cygpath -u "$RUNNER_TEMP")/qumesh-install"
          cmake --install build --prefix "$PREFIX"
          .github/scripts/verify-windows-install.sh "$PREFIX"

  # Mirrors the matrix used by release.yml's `build-linux` job so PRs
  # catch the two regressions that are easy to introduce when only
  # macOS/Windows are tested at PR time:
  #
  #   1. CPack-DEB shipping bundled Qt instead of using package deps
  #      (the bug behind #256 — the .deb tripled in size and
  #      collided with the distro's own /usr/lib/<triplet>/qt6/
  #      paths). The dpkg-deb step at the bottom is the guard.
  #   2. arm64-only build breaks. install-qt-action's Linux prebuilt
  #      is amd64-only, so previously CI couldn't compile-check arm64.
  #      Now we use the distro's apt-installed Qt inside an arm64
  #      container on GH's native arm runners.
  build-linux:
    name: Build & test (${{ matrix.distro_label }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container_image: 'ubuntu:26.04'
            distro_label: 'Ubuntu 26.04'
            arch: amd64
            runs_on: ubuntu-latest
          - container_image: 'ubuntu:26.04'
            distro_label: 'Ubuntu 26.04'
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - container_image: 'debian:13'
            distro_label: 'Debian 13'
            arch: amd64
            runs_on: ubuntu-latest
          - container_image: 'debian:13'
            distro_label: 'Debian 13'
            arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates curl \
            cmake ninja-build build-essential \
            python3 file \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-tools-dev \
            libqt6svg6-dev \
            libssh-dev libssl-dev \
            dpkg-dev

      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --parallel

      - name: Package (.deb)
        shell: bash
        working-directory: build
        run: cpack -G DEB --verbose

      - name: Verify .deb doesn't bundle Qt
        shell: bash
        working-directory: build
        run: |
          set -eux
          DEB=$(ls qumesh_*.deb | head -1)
          if dpkg-deb -c "$DEB" | grep -q '/qt6/'; then
            echo "::error::$DEB contains /qt6/ paths — Qt is being bundled (#256)."
            dpkg-deb -c "$DEB" | grep '/qt6/'
            exit 1
          fi
          # Log the resolved deps so the run output makes the Qt-via-
          # shlibdeps wiring auditable at a glance.
          dpkg-deb -f "$DEB" Depends

  release-body:
    # release.yml only fires on `v*.*.*` tags, so nothing in CI ever
    # exercised the text it publishes. That is how every release from
    # v1.1.0 to v1.4.1 came to tell macOS users to right-click → Open
    # past a Gatekeeper prompt that a signed, notarized bundle never
    # raises (#443). This job runs the release-body assembly on every
    # PR instead.
    name: Release body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release-body.sh
        run: .github/scripts/test-release-body.sh

      # Same blind spot for the appcast: the v1.4.2 notes' `QuMesh\bin\`
      # broke the publish step's XML (#447). xmllint checks the output
      # and isn't preinstalled on ubuntu-latest (see #210).
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Test render-appcast-notes.sh
        run: .github/scripts/test-render-appcast-notes.sh

      - name: Shellcheck the release scripts
        run: |
          shellcheck .github/scripts/release-body.sh .github/scripts/test-release-body.sh \
                     .github/scripts/render-appcast-notes.sh .github/scripts/test-render-appcast-notes.sh

  windows-install-verifier:
    # verify-windows-install.sh guards the Windows install layout
    # (#445) in the Windows job above and in release.yml. Its layout
    # and import checks are plain bash, so exercise them here against
    # fake install trees — including the broken v1.4.1 shape — so a
    # change that blinds the verifier fails on its own.
    name: Windows install verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test verify-windows-install.sh
        run: .github/scripts/test-verify-windows-install.sh

      - name: Shellcheck the verifier
        run: shellcheck .github/scripts/verify-windows-install.sh .github/scripts/test-verify-windows-install.sh
